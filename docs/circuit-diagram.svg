<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670"><title>ESP32 BME280 OLED RGB and local Assist path</title><rect width="1100" height="670" fill="white"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID13 • ESP32 DevKit • USB5V supply; all sensor/GPIO logic 3.3V</text><rect x="40" y="100" width="350" height="350" fill="#e9f4fa" stroke="#123"/><text x="60" y="135">ESP32 ESPHome</text><text x="60" y="185">3V3 → BME/OLED VCC</text><text x="60" y="240">GPIO21 SDA; GPIO22 SCL</text><text x="60" y="295">GPIO25/26/27 → R/G/B</text><text x="60" y="350">Each color through330Ω resistor</text><text x="60" y="410">GND → all grounds/cathode</text><rect x="650" y="100" width="410" height="130" fill="#eef8ee" stroke="#123"/><text x="670" y="130">BME280 I2C0x76</text><text x="670" y="165">VCC/CSB→3V3; GND/SDO→GND</text><text x="670" y="200">SDA→21; SCL→22</text><rect x="650" y="255" width="410" height="100" fill="#eef8ee" stroke="#123"/><text x="670" y="285">SSD1306 128x64 OLED I2C0x3C</text><text x="670" y="315">VCC→3V3; GND→GND</text><text x="670" y="345">SDA→21; SCL→22</text><text x="650" y="405">Common-cathode RGB LED:</text><text x="650" y="440">25→330Ω→R;26→330Ω→G;27→330Ω→B</text><text x="650" y="475">Common cathode→GND</text><text x="25" y="530">Phone microphone → local HA Assist (Whisper/Piper) → Wi-Fi native API → RGB LED</text><text x="25" y="575">ESP32 has no microphone. OLED upper bar temperature 0–40°C; lower RH 0–100%.</text><text x="25" y="620">All I2C pull-ups to3.3V. No actuator or mains circuit.</text></g><g fill="none" stroke="#287396" stroke-width="3"><path d="M390 235 H540 V195 H650 M540 235 V340 H650"/><path d="M390 290 H580 V440 H640"/><path d="M390 405 H560 V490 H1060"/></g></svg>