esphome:
  name: smart-entryway-voice
  friendly_name: Smart Entryway Voice
  includes: [bar.h]
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      id: temperature
      name: Temperature
    humidity:
      id: humidity
      name: Humidity
    pressure:
      name: Pressure
    update_interval: 10s
output:
  - platform: ledc
    pin: GPIO25
    id: red_out
  - platform: ledc
    pin: GPIO26
    id: green_out
  - platform: ledc
    pin: GPIO27
    id: blue_out
light:
  - platform: rgb
    name: Entryway Indicator
    id: indicator
    red: red_out
    green: green_out
    blue: blue_out
    restore_mode: ALWAYS_OFF
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      int t=bar(id(temperature).state,0,40);
      int h=bar(id(humidity).state,0,100);
      it.rectangle(0,4,128,18); it.rectangle(0,36,128,18);
      if(t>=0) it.filled_rectangle(2,6,t,14); else {it.line(2,6,126,20);it.line(2,20,126,6);}
      if(h>=0) it.filled_rectangle(2,38,h,14); else {it.line(2,38,126,52);it.line(2,52,126,38);}
